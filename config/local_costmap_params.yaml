global_frame: odom
robot_base_frame: base_footprint
update_frequency: 5.0
publish_frequency: 2.0
transform_tolerance: 1.0
rolling_window: true
width: 4.0
height: 4.0
resolution: 0.05
plugins:
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

obstacle_layer:
  obstacle_range: 2.5
  raytrace_range: 3.0
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: $(arg laser_frame)
    data_type: LaserScan
    topic: $(arg scan_topic)
    marking: true
    clearing: true
    inf_is_valid: true
    observation_persistence: 0.0
    expected_update_rate: 0.15

inflation_layer:
  inflation_radius: 0.18
