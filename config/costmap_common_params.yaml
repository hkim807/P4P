footprint: [[0.16, 0.14], [0.16, -0.14], [-0.16, -0.14], [-0.16, 0.14]]
footprint_padding: 0.01

obstacle_range: 2.5
raytrace_range: 3.0
inflation_radius: 0.18
transform_tolerance: 0.5

observation_sources: laser_scan_sensor
laser_scan_sensor:
  sensor_frame: $(arg laser_frame)
  data_type: LaserScan
  topic: $(arg scan_topic)
  marking: true
  clearing: true
  inf_is_valid: true
  observation_persistence: 0.0
  expected_update_rate: 0.15

map_type: costmap
track_unknown_space: true
always_send_full_costmap: true
