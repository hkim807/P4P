TrajectoryPlannerROS:
  holonomic_robot: false

  max_vel_x: 0.22
  min_vel_x: 0.05
  min_in_place_vel_theta: 0.20
  max_vel_theta: 0.70
  min_vel_theta: -0.70
  min_in_place_rotational_vel: 0.20

  acc_lim_x: 0.45
  acc_lim_theta: 0.9
  acc_lim_y: 0.0

  escape_vel: -0.08

  sim_time: 1.5
  sim_granularity: 0.025
  angular_sim_granularity: 0.05
  vx_samples: 8
  vtheta_samples: 20
  controller_frequency: 8.0

  meter_scoring: true
  pdist_scale: 0.6
  gdist_scale: 0.8
  occdist_scale: 0.02
  heading_lookahead: 0.325
  heading_scoring: false
  heading_scoring_timestep: 0.8
  dwa: false
  publish_cost_grid_pc: true

  xy_goal_tolerance: 0.20
  yaw_goal_tolerance: 0.30
  latch_xy_goal_tolerance: false

  oscillation_reset_dist: 0.10
  prune_plan: true
